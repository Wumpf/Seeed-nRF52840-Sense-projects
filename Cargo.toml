[workspace]
members = ["hello_world", "usb_serial"]
resolver = "2"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = [
    "critical-section-single-core",
    "inline-asm",
] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
nrf52840-hal = "0.19.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
